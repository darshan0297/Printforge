      </div>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>

      <div class="sidebar-section lbl">Services</div>
      <a href="admin-print3d.html" class="sidebar-link" data-page="print3d"><span class="li">🖨️</span> <span class="lbl">3D Print Quotes</span> <span class="nb" id="nb-print3d"></span></a>

  <main class="admin-main">
    <div class="admin-content">
      <div class="page-actions">
        <h1>3D Print Quotes</h1>
        <button class="btn btn-outline btn-sm" onclick="loadPrint3dQuotes()">↻ Refresh</button>
      </div>
      <div class="search-action">
        <input type="text" placeholder="Search by name or contact…" id="p3dSearch" oninput="filterPrint3dQuotes()">
        <select class="filter-select" id="p3dStatusFilter" onchange="filterPrint3dQuotes()">
          <option value="">All</option>
          <option>new</option><option>reviewing</option><option>quoted</option><option>accepted</option><option>completed</option>
        </select>
      </div>
      <div id="print3dQuotesList"></div>
    </div>

<div id="toast"><span class="toast-icon"></span><span class="toast-msg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
let allPrint3dQuotes = [];

async function loadAllPrint3dQuotes() {
  try {
    const {data,error}=await getSupabase().from('print3d_quotes').select('*').order('created_at',{ascending:false});
    allPrint3dQuotes=error?DEMO_PRINT3D_QUOTES:(data||DEMO_PRINT3D_QUOTES);
  } catch {allPrint3dQuotes=DEMO_PRINT3D_QUOTES;}
}

async function loadPrint3dQuotes() {
  await loadAllPrint3dQuotes();
  filterPrint3dQuotes();
}

function filterPrint3dQuotes() {
  const search=document.getElementById('p3dSearch')?.value.toLowerCase()||'';
  const status=document.getElementById('p3dStatusFilter')?.value||'';
  let q=allPrint3dQuotes;
  if(search) q=q.filter(x=>(x.name+x.contact_info).toLowerCase().includes(search));
  if(status) q=q.filter(x=>x.status===status);
  renderPrint3dList(q);
}

const P3D_COLORS={new:'badge-red',reviewing:'badge-yellow',quoted:'badge-yellow',accepted:'badge-green',completed:'badge-green'};

function renderPrint3dList(quotes) {
  const el=document.getElementById('print3dQuotesList');
  if (!quotes.length) {el.innerHTML=`<div class="empty-state"><p>No 3D print quote requests yet.</p></div>`; return;}
  el.innerHTML=quotes.map(q=>`
    <div class="lq-card" id="p3dcard-${q.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
        <div>
          <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.25rem">
            <span style="font-family:Space Grotesk,sans-serif;font-weight:800">${q.name}</span>
            <span class="badge ${P3D_COLORS[q.status]||'badge-gray'}">${q.status}</span>
            <span style="font-size:.72rem;color:var(--muted)">${fmtDate(q.created_at)}</span>
          </div>
          <div style="font-size:.8rem;color:var(--text2)">${q.contact_info||'—'}</div>
        </div>
        <div style="display:flex;gap:.5rem;flex-shrink:0;align-items:center;flex-wrap:wrap">
          <select class="inline-select" onchange="updatePrint3dStatus('${q.id}',this.value)">
            ${['new','reviewing','quoted','accepted','completed'].map(s=>`<option${s===q.status?' selected':''}>${s}</option>`).join('')}
          </select>
          ${q.contact_info?.includes('@')
            ?`<a href="mailto:${q.contact_info}?subject=Re: 3D Print Quote ${q.id}" class="btn btn-accent btn-sm">Reply</a>`
            :q.contact_info
              ?`<a href="https://wa.me/${q.contact_info.replace(/\D/g,'')}" target="_blank" class="btn btn-accent btn-sm">WhatsApp</a>`
              :''}
        </div>
      </div>
      ${q.notes?`<div style="font-size:.82rem;color:var(--text2);background:var(--surface);border-radius:var(--r);padding:.75rem 1rem;line-height:1.6;margin-top:.75rem">${q.notes}</div>`:''}
      ${q.file_name||q.drive_file_url?`
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem;align-items:center">
        ${q.file_name?`<span style="font-size:.8rem;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.3rem .75rem">📎 ${q.file_name}</span>`:''}
        ${q.drive_file_url?`<a href="${q.drive_file_url}" target="_blank" class="btn btn-accent btn-sm">☁️ Open in Drive</a>`:'<span style="font-size:.75rem;color:var(--muted)">No file attached</span>'}
      </div>`:''}
    </div>`).join('');
}

async function updatePrint3dStatus(id, status) {
  try {await getSupabase().from('print3d_quotes').update({status,updated_at:new Date().toISOString()}).eq('id',id);} catch {}
  const q=allPrint3dQuotes.find(x=>x.id===id);
  if(q) q.status=status;
  setBadge('nb-print3d',allPrint3dQuotes.filter(q=>q.status==='new').length);
}

async function pageInit() {
  await loadPrint3dQuotes();
}
</script>
