<!-- LASER QUOTE DETAIL MODAL -->
<div class="modal-bg" id="laserModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title">Quote <span id="lm-id" style="color:var(--accent)"></span></div>
      <button class="modal-close" onclick="document.getElementById('laserModal').classList.remove('open')">?</button>
    </div>
    <div id="lm-body"></div>
    <div style="display:flex;gap:.875rem;justify-content:flex-end;margin-top:1.5rem">
      <button class="btn btn-outline" onclick="document.getElementById('laserModal').classList.remove('open')">Close</button>
      <button class="btn btn-accent" id="lm-convert-btn" onclick="convertQuoteToOrder()">Convert to Order ?</button>
    </div>
  </div>
</div>

<div id="toast"><span class="toast-icon"></span><span class="toast-msg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>
let allLaserQuotes = [];
let currentLaserQuote = null;

async function loadAllLaserQuotes() {
  try {
    const {data,error}=await getSupabase().from('laser_quotes').select('*').order('created_at',{ascending:false});
    allLaserQuotes=error?DEMO_LASER_QUOTES:(data||DEMO_LASER_QUOTES);
  } catch {allLaserQuotes=DEMO_LASER_QUOTES;}
}

async function loadLaserQuotes() {
  await loadAllLaserQuotes();
  filterLaserQuotes();
}

function filterLaserQuotes() {
  const search=document.getElementById('laserSearch')?.value.toLowerCase()||'';
  const status=document.getElementById('laserStatusFilter')?.value||'';
  let q=allLaserQuotes;
  if(search) q=q.filter(x=>(x.name+x.email).toLowerCase().includes(search));
  if(status) q=q.filter(x=>x.status===status);
  renderLaserList(q);
}

const LQ_COLORS={new:'badge-red',quoted:'badge-yellow',accepted:'badge-green',declined:'badge-gray',completed:'badge-green'};

function renderLaserList(quotes) {
  const el=document.getElementById('laserQuotesList');
  if (!quotes.length) {el.innerHTML=`<div class="empty-state"><p>No laser quote requests.</p></div>`; return;}
  el.innerHTML=quotes.map(q=>`
    <div class="lq-card" id="lqcard-${q.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
        <div>
          <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.25rem">
            <span style="font-family:Space Grotesk,sans-serif;font-weight:800">${q.name}</span>
            <span class="badge ${LQ_COLORS[q.status]||'badge-gray'}">${q.status}</span>
            <span style="font-size:.72rem;color:var(--muted)">${fmtDate(q.created_at)}</span>
          </div>
          <div style="font-size:.8rem;color:var(--text2)">${q.email}${q.phone?' � '+q.phone:''}</div>
        </div>
        <div style="display:flex;gap:.5rem;flex-shrink:0;align-items:center">
          <select class="inline-select" onchange="updateLaserStatus('${q.id}',this.value)">
            ${['new','quoted','accepted','declined','completed'].map(s=>`<option${s===q.status?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-outline btn-sm" onclick="openLaserModal(${JSON.stringify(q).replace(/"/g,'&quot;')})">Detail</button>
          <a href="mailto:${q.email}?subject=Re: Laser Quote ${q.id}" class="btn btn-accent btn-sm">Reply</a>
        </div>
      </div>
      <div class="lq-meta-grid">
        <div class="lq-meta-item"><div class="lq-meta-label">Material</div><div class="lq-meta-val">${q.material}</div></div>
        <div class="lq-meta-item"><div class="lq-meta-label">Operation</div><div class="lq-meta-val">${q.operation}</div></div>
        <div class="lq-meta-item"><div class="lq-meta-label">Quantity</div><div class="lq-meta-val">${q.quantity}</div></div>
        ${q.width_cm?`<div class="lq-meta-item"><div class="lq-meta-label">Size</div><div class="lq-meta-val">${q.width_cm}�${q.height_cm}cm</div></div>`:''}
        ${q.quoted_price?`<div class="lq-meta-item"><div class="lq-meta-label">Quoted Price</div><div class="lq-meta-val" style="color:var(--accent)">${fmt(q.quoted_price)}</div></div>`:''}
      </div>
      ${q.notes?`<div style="font-size:.82rem;color:var(--text2);background:var(--surface);border-radius:var(--r);padding:.75rem 1rem;line-height:1.6;margin-bottom:${q.file_urls?.length?'.75rem':'0'}">${q.notes}</div>`:''}
      ${q.file_urls?.length?`<div style="display:flex;gap:.5rem;flex-wrap:wrap">${q.file_urls.map((u,i)=>`<a href="${u}" target="_blank" class="btn btn-outline btn-sm">?? File ${i+1}</a>`).join('')}</div>`:''}
    </div>`).join('');
}

function openLaserModal(q) {
  currentLaserQuote=q;
  document.getElementById('lm-id').textContent=q.id;
  document.getElementById('lm-body').innerHTML=`
    <div class="form-row" style="margin-bottom:1rem">
      <div class="form-group"><label class="form-label">Quoted Price (LKR)</label><input type="number" id="lm-price" value="${q.quoted_price||''}" placeholder="Enter your quote" min="0"></div>
      <div class="form-group"><label class="form-label">Status</label>
        <select id="lm-status">
          ${['new','quoted','accepted','declined','completed'].map(s=>`<option${s===q.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Admin Notes (internal)</label><textarea id="lm-notes" rows="3" placeholder="Internal notes � customer won't see this">${q.admin_notes||''}</textarea></div>
    <div style="background:var(--surface);border-radius:var(--r);padding:1rem;font-size:.82rem;line-height:1.8;margin-top:.5rem">
      <strong>${q.name}</strong> � ${q.email}${q.phone?' � '+q.phone:''}<br>
      ${q.material}${q.colour?' ('+q.colour+')':''} � ${q.operation} � qty ${q.quantity}
      ${q.width_cm?' � '+q.width_cm+'�'+q.height_cm+'cm':''}
      ${q.notes?'<br><em style="color:var(--text2)">'+q.notes+'</em>':''}
    </div>`;
  document.getElementById('laserModal').classList.add('open');
}

async function saveLaserModalChanges() {
  if (!currentLaserQuote) return;
  const price =parseFloat(document.getElementById('lm-price').value)||null;
  const status=document.getElementById('lm-status').value;
  const notes =document.getElementById('lm-notes').value.trim();
  const update={quoted_price:price,status,admin_notes:notes,updated_at:new Date().toISOString()};
  try {await getSupabase().from('laser_quotes').update(update).eq('id',currentLaserQuote.id);} catch {}
  Object.assign(currentLaserQuote,update);
  const idx=allLaserQuotes.findIndex(q=>q.id===currentLaserQuote.id);
  if(idx>=0) allLaserQuotes[idx]={...allLaserQuotes[idx],...update};
  filterLaserQuotes();
}

async function convertQuoteToOrder() {
  await saveLaserModalChanges();
  const q=currentLaserQuote;
  const nameParts=(q.name||'').split(' ');
  const fakeOrder={
    id:'ORD-LQ-'+q.id,
    customer_email:q.email, customer_firstname:nameParts[0]||'', customer_lastname:nameParts.slice(1).join(' ')||'',
    customer_phone:q.phone||'', customer_address:'', customer_notes:`Laser job: ${q.material}, ${q.operation}, qty ${q.quantity}. ${q.notes||''}`.trim(),
    items:[{name:`Laser Cutting � ${q.material} (${q.operation})`,qty:q.quantity,price:q.quoted_price||0}],
    subtotal:(q.quoted_price||0)*q.quantity, delivery_fee:350, total:(q.quoted_price||0)*q.quantity+350,
    status:'pending', tracking_number:'', created_at:new Date().toISOString(),
  };
  document.getElementById('laserModal').classList.remove('open');
  sessionStorage.setItem('pf_pending_order',JSON.stringify(fakeOrder));
  window.location.href='admin-orders.html';
}

async function updateLaserStatus(id, status) {
  try {await getSupabase().from('laser_quotes').update({status,updated_at:new Date().toISOString()}).eq('id',id);} catch {}
  const q=allLaserQuotes.find(x=>x.id===id);
  if(q) q.status=status;
  setBadge('nb-laser',allLaserQuotes.filter(q=>q.status==='new').length);
  Toast.show(`Quote ? ${status}`,'success');
}

async function pageInit() {
  await loadLaserQuotes();
}
</script>
</body>
