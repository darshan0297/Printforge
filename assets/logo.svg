<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" role="img" aria-label="PrintForge Lanka">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- ── Icon badge ── -->
  <rect x="2" y="2" width="76" height="76" rx="14" fill="#0f172a"/>
  <rect x="2" y="2" width="76" height="76" rx="14" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Nozzle head -->
  <rect x="29" y="8" width="22" height="6" rx="3" fill="url(#g1)"/>
  <!-- Nozzle shaft -->
  <path d="M33 14 L47 14 L44 28 L36 28 Z" fill="url(#g1)"/>
  <!-- Nozzle tip dot -->
  <circle cx="40" cy="30" r="3.5" fill="#4ade80"/>

  <!-- Printed layers (building up, bottom to top) -->
  <rect x="14" y="56" width="52" height="9" rx="3.5" fill="url(#g1)" opacity="1"/>
  <rect x="16" y="44" width="48" height="9" rx="3.5" fill="url(#g1)" opacity="0.65"/>
  <rect x="20" y="32" width="40" height="9" rx="3.5" fill="url(#g1)" opacity="0.3"/>

  <!-- Bottom fill line -->
  <rect x="14" y="67" width="52" height="3" rx="1.5" fill="#4ade80" opacity="0.15"/>

  <!-- ── Wordmark ── -->
  <!-- "Print" -->
  <text x="94" y="46"
    font-family="'Space Grotesk', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-0.5"
    fill="#f8fafc">Print</text>

  <!-- "Forge" in green -->
  <text x="202" y="46"
    font-family="'Space Grotesk', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-0.5"
    fill="#4ade80">Forge</text>

  <!-- "LANKA" label -->
  <text x="96" y="66"
    font-family="'Space Grotesk', Arial, sans-serif"
    font-weight="600"
    font-size="11.5"
    letter-spacing="5.5"
    fill="#64748b">LANKA</text>
</svg>
